[workspace]
members = ["crates/void-engine", "crates/void-demo"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Mi5hlen (Михаил Однолетко)"]
license-file = "LICENSE"
repository = "https://github.com/NagiButor/void-engine"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
glam = { version = "0.27", features = ["bytemuck"] }
wgpu = "0.20.1"
winit = "0.29.15"
egui = "0.28.1"
egui-wgpu = "0.28.1"
egui-winit = "0.28.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.3"
rapier3d = "0.22"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
